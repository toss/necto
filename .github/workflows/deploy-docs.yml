name: Deploy docs

on:
  workflow_dispatch:
  # Only the files the site is built from. Swift and plugin changes are far more
  # frequent here, and none of them change what is published.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          corepack enable
          yarn install --immutable

      - name: Build the site
        run: yarn docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
