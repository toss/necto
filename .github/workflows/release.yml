name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'toss/necto' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ inputs.version }}
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Validate release and successful main CI
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/github-release.mjs prepare "$VERSION"
      - name: Check out the release commit
        env:
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          cp script/release "$RUNNER_TEMP/necto-release"
          git checkout --detach "$RELEASE_COMMIT"
      - name: Install and build web dependencies
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Test and package release
        env:
          NECTO_RELEASE_ROOT: ${{ github.workspace }}
        run: bash "$RUNNER_TEMP/necto-release" "$VERSION" --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.version }}
          path: |
            Build/Necto-${{ inputs.version }}.dmg
            Build/Necto-${{ inputs.version }}.dmg.sha256
            Build/necto-bridge-${{ inputs.version }}.tgz
            Build/create-necto-plugin-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.version }}
          path: Build
      - name: Tag, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node script/github-release.mjs publish "$VERSION" "$RELEASE_COMMIT"

  android:
    name: Android SDK on JitPack
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # JitPack builds a tag on its first request, and the build log answers once the
      # build has ended. Asking here keeps the first app that adds the release from waiting.
      - name: Build the release on JitPack
        run: |
          curl --fail --silent --show-error --max-time 900 \
            "https://jitpack.io/com/github/toss/necto/$VERSION/build.log" | tail -n 20
          status="$(curl --fail --silent --show-error https://jitpack.io/api/builds/com.github.toss/necto \
            | jq -r --arg version "$VERSION" '.["com.github.toss"].necto[$version]')"
          echo "JitPack build of $VERSION: $status"
          [[ "$status" == ok ]]
      - name: Check selective consumers against JitPack
        run: script/test-android-consumer --jitpack "$VERSION"
