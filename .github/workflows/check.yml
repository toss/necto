name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test Mac and CLI packages
        run: swift test --package-path NectoMac --verbose
      - name: Test native integrations and Mac app
        run: script/test native
      - name: Build the Mac app, CLI and E2E tests
        run: script/test-e2e build-mac
      - name: Test release artifacts
        run: node --test script/tests/release.test.mjs
      - name: Archive Mac E2E products
        working-directory: Build/E2E/Products
        run: tar -czf ../mac.tar.gz Debug/Necto.app Debug/necto-cli Debug/NectoE2ETests.xctest NectoE2ETests_*.xctestrun
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-mac
          path: Build/E2E/mac.tar.gz
          if-no-files-found: error
          retention-days: 1

  sdk:
    name: SDK Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test SDK packages
        run: swift test --verbose
      - name: Test SDK consumer
        run: swift test --package-path Tests/Fixtures/SDKConsumer --verbose
      - name: Test package boundaries
        run: node --test script/tests/package.test.mjs
      - name: Build the iOS example
        run: script/test-e2e build-sdk
      - name: Archive simulator E2E products
        run: tar -czf Build/E2E/sdk.tar.gz -C Build/E2E/Products Debug-iphonesimulator/ExampleApp.app
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-sdk
          path: Build/E2E/sdk.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Simulator Connection & CLI E2E
    needs: [mac, sdk]
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/download-artifact@v8
        with:
          name: e2e-mac
          path: Build/E2E
      - uses: actions/download-artifact@v8
        with:
          name: e2e-sdk
          path: Build/E2E
      - name: Extract E2E products
        run: |
          mkdir -p Build/E2E/Products
          tar -xzf Build/E2E/mac.tar.gz -C Build/E2E/Products
          tar -xzf Build/E2E/sdk.tar.gz -C Build/E2E/Products
      - name: Test simulator connection and CLI
        run: script/test-e2e run
      - name: Upload E2E results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-e2e-results
          path: Build/E2E/Logs
          retention-days: 7

  web:
    name: Web Plugins Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build web packages
        run: yarn build
      - name: Test web packages and panel contracts
        run: script/test web

  docs:
    name: Documentation Build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build documentation
        run: yarn docs:build
