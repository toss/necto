name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift & macOS (Xcode ${{ matrix.xcode }})
    if: github.server_url == 'https://github.com'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16", "26.3"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Test SDK, Mac packages and SDK consumer
        run: script/test swift
      - name: Test native integrations and Mac app
        run: script/test native
      - name: Build the Mac app for both architectures
        run: >-
          xcodebuild -project Necto.xcodeproj -scheme Necto
          -destination 'generic/platform=macOS' ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO build
      - name: Build the iOS example
        run: >-
          xcodebuild -project Necto.xcodeproj -scheme ExampleApp
          -destination 'generic/platform=iOS Simulator' ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO build

  web:
    name: Web tests & documentation
    if: github.server_url == 'https://github.com'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build web packages
        run: yarn build
      - name: Test web packages and panel contracts
        run: script/test web
      - name: Test package boundaries and release artifacts
        run: script/test release
      - name: Build documentation
        run: yarn docs:build
