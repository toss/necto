name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test Mac and CLI packages
        run: swift test --package-path NectoMac --verbose
      - name: Test native integrations and Mac app
        run: script/test native
      - name: Build the Mac app, CLI and E2E tests
        run: script/test-e2e build-mac
      - name: Test release artifacts
        run: node --test script/tests/release.test.mjs script/tests/github-release.test.mjs script/tests/create-plugin.test.mjs
      - name: Archive Mac E2E products
        working-directory: Build/E2E/Products
        run: tar -czf ../mac.tar.gz Debug/Necto.app Debug/necto-cli Debug/NectoE2ETests.xctest NectoE2ETests_*.xctestrun
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-mac
          path: Build/E2E/mac.tar.gz
          if-no-files-found: error
          retention-days: 1

  sdk:
    name: iOS SDK Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test SDK packages
        run: swift test --verbose
      - name: Test SDK consumer
        run: swift test --package-path SDK/iOS/Tests/Fixtures/SDKConsumer --verbose
      - name: Test package boundaries
        run: node --test script/tests/package.test.mjs
      - name: Build the iOS example
        run: script/test-e2e build-sdk
      - name: Archive simulator E2E products
        run: tar -czf Build/E2E/sdk.tar.gz -C Build/E2E/Products Debug-iphonesimulator/ExampleApp.app
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-sdk
          path: Build/E2E/sdk.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: iOS Simulator Connection & CLI E2E
    needs: [mac, sdk]
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/download-artifact@v8
        with:
          name: e2e-mac
          path: Build/E2E
      - uses: actions/download-artifact@v8
        with:
          name: e2e-sdk
          path: Build/E2E
      - name: Extract E2E products
        run: |
          mkdir -p Build/E2E/Products
          tar -xzf Build/E2E/mac.tar.gz -C Build/E2E/Products
          tar -xzf Build/E2E/sdk.tar.gz -C Build/E2E/Products
      - name: Test simulator connection and CLI
        run: script/test-e2e run
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-e2e-results
          path: Build/E2E/Logs
          retention-days: 7

  web:
    name: Web Plugins Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build web packages
        run: yarn build
      - name: Test web packages and panel contracts
        run: script/test web

  android:
    name: Android SDK Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test the Android SDK and sample
        working-directory: SDK/Android
        run: ./gradlew build --console=plain
      - name: Test Android artifacts
        run: script/test-android-artifacts
      - name: Test selective Android SDK consumers
        run: script/test-android-consumer
      - name: Upload Android test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            SDK/Android/*/build/reports/tests
            SDK/Plugins/*/Android/build/reports/tests
          retention-days: 7

  android-e2e:
    name: Android Emulator Connection E2E
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK packages
        run: >
          (yes || true) | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator"
          "system-images;android-35;google_apis;x86_64"
      - name: Build the Android sample
        working-directory: SDK/Android
        run: ./gradlew :sample:assembleDebug --console=plain
      - name: Boot an emulator
        run: |
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd --force \
            --name necto --package "system-images;android-35;google_apis;x86_64"
          nohup $ANDROID_HOME/emulator/emulator -avd necto -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb=$ANDROID_HOME/platform-tools/adb
          $adb wait-for-device
          timeout 300 $adb shell 'until [ "$(getprop sys.boot_completed)" = 1 ]; do sleep 2; done'
          $adb shell svc power stayon true
          $adb shell wm dismiss-keyguard
      # The Necto host runs on macOS only and hosted Mac runners cannot run an emulator,
      # so this speaks to the SDK directly, the way the host does over ADB.
      - name: Test the SDK connection on the emulator
        run: |
          script/android-sample emulator-5554 --sdk-only
          script/test-android-security
      - name: Upload emulator E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-e2e-results
          path: |
            Build/Android/Logs
            Build/Android/security-results.json
            ${{ runner.temp }}/emulator.log
          retention-days: 7

  docs:
    name: Documentation Build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build documentation
        run: yarn docs:build
